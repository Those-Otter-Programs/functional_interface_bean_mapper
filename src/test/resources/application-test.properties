spring.application.name=functionalBeanMapper
spring.datasource.url=jdbc:h2:mem:test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none 
spring.jpa.properties.hibernate.formatSql=true
spring.jpa.properties.hibernate.showSql=true
spring.jpa.properties.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
